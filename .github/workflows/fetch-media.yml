name: Fetch generated media

# Helper: Claude Code sessions for this repo run in a sandbox whose egress
# policy only allows GitHub, so this workflow pulls Higgsfield-generated
# media onto the branch (and republishes gh-pages so the asset is servable).

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Source URL to download"
        required: true
      dest:
        description: "Destination path in the repo"
        required: true
        default: "site/assets/video/hero-active.mp4"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download media
        run: |
          mkdir -p "$(dirname '${{ inputs.dest }}')"
          curl -fsSL --retry 3 -o "${{ inputs.dest }}" "${{ inputs.url }}"
          ls -la "${{ inputs.dest }}"

      - name: Commit media to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.dest }}"
          git commit -m "Add fetched media: ${{ inputs.dest }}"
          git push

      - name: Publish to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/ghp gh-pages
          mkdir -p "/tmp/ghp/$(dirname '${{ inputs.dest }}')"
          cp "${{ inputs.dest }}" "/tmp/ghp/${{ inputs.dest }}"
          cd /tmp/ghp
          git add "${{ inputs.dest }}"
          git commit -m "Publish fetched media: ${{ inputs.dest }}"
          git push origin gh-pages
