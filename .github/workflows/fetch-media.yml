name: Fetch generated media

# Helper: the Claude Code session that builds this site runs in a sandbox
# whose egress policy only allows GitHub, so this workflow pulls
# Higgsfield-generated media onto the branch where the sandbox can reach it.
# Dispatch it with a media URL + destination path to fetch any new asset.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTPS URL of the media file to download"
        required: true
        type: string
      dest:
        description: "Repo-relative destination path (e.g. media/hero-loop.mp4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download media
        run: |
          case "${{ inputs.dest }}" in
            *..*|/*) echo "Refusing suspicious destination path" >&2; exit 1 ;;
          esac
          mkdir -p "$(dirname "${{ inputs.dest }}")"
          curl -fsSL --retry 3 -o "${{ inputs.dest }}" "${{ inputs.url }}"
          ls -la "${{ inputs.dest }}"

      - name: Commit media to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.dest }}"
          git commit -m "Add generated media: ${{ inputs.dest }}"
          git push
